<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Alone - Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtN7nwhc1XrYa8mGNLMQlKicFj-f5yG0k",
            authDomain: "notalonewithgemini.firebaseapp.com",
            projectId: "notalonewithgemini",
            databaseURL: "https://notalonewithgemini-default-rtdb.firebaseio.com",
            storageBucket: "notalonewithgemini.firebasestorage.app",
            messagingSenderId: "541160542822",
            appId: "1:541160542822:web:12570e417ed92c3f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        const ADMIN_USER = "admin"; 
        const ADMIN_PASS = "913132386V"; 

        window.handleLogin = async () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if(!user || !pass) return alert("විස්තර පුරවන්න.");

            if(user === ADMIN_USER && pass === ADMIN_PASS) {
                localStorage.setItem('isAdmin', 'true');
                showAdminPanel();
                return;
            }

            const userRef = ref(db, 'users/' + user);
            const snapshot = await get(userRef);
            if (!snapshot.exists()) {
                await set(userRef, { password: pass, isPaid: false });
                window.location.href = `https://wa.me/94773364401?text=New Register: ${user}`;
                alert("ගිණුම සෑදුවා! සන්නාම (Anjana) විසින් Approve කළ පසු ලොග් විය හැක.");
            } else {
                const userData = snapshot.val();
                if(userData.password === pass) {
                    if(userData.isPaid) {
                        localStorage.setItem('chatUser', user);
                        location.reload();
                    } else { alert("ඔබේ ගිණුම සක්‍රීය නැත. WhatsApp අමතන්න."); }
                } else { alert("මුරපදය වැරදියි!"); }
            }
        };

        function showAdminPanel() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            onValue(ref(db, 'users'), (s) => {
                const list = document.getElementById('user-list');
                list.innerHTML = "";
                s.forEach(c => {
                    const data = c.val();
                    if(c.key !== ADMIN_USER) {
                        list.innerHTML += `<div class="p-4 bg-slate-700 mb-2 rounded-xl flex justify-between items-center">
                            <div><b>${c.key}</b><br><span class="text-xs text-yellow-400 italic">Pass: ${data.password}</span></div>
                            <button onclick="approveUser('${c.key}')" class="${data.isPaid ? 'bg-green-600' : 'bg-blue-600'} px-4 py-2 rounded-lg text-xs">${data.isPaid ? 'Approved ✓' : 'Approve'}</button>
                        </div>`;
                    }
                });
            });
        }

        window.approveUser = (name) => update(ref(db, 'users/' + name), { isPaid: true });

        window.onload = () => {
            if(localStorage.getItem('isAdmin')) showAdminPanel();
            else if(localStorage.getItem('chatUser')) showChat();
        };

        function showChat() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            onValue(ref(db, 'chat'), (s) => {
                const b = document.getElementById('messages'); b.innerHTML = "";
                s.forEach(c => {
                    const m = c.val();
                    const isMe = m.u === localStorage.getItem('chatUser');
                    let content = m.type === 'image' ? `<img src="${m.t}" class="rounded-lg max-w-full mt-2 border border-slate-600">` : `<p class="text-sm mt-1">${m.t}</p>`;
                    b.innerHTML += `<div class="flex ${isMe ? 'justify-end' : 'justify-start'} mb-3 animate-fade-in">
                        <div class="${isMe ? 'bg-blue-600' : 'bg-slate-700'} p-3 rounded-2xl max-w-[85%] shadow-lg">
                            <p class="text-[10px] font-bold ${isMe ? 'text-blue-200' : 'text-blue-400'}">${m.u}</p>
                            ${content}
                        </div></div>`;
                });
                b.scrollTop = b.scrollHeight;
            });
        }

        window.send = () => {
            const t = document.getElementById('msg').value;
            if(t) push(ref(db, 'chat'), { u: localStorage.getItem('chatUser'), t: t, type: 'text' });
            document.getElementById('msg').value = "";
        };

        window.uploadImage = async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const fileRef = sRef(storage, 'chat/' + Date.now() + "_" + file.name);
            const status = document.getElementById('upload-status');
            status.classList.remove('hidden');
            await uploadBytes(fileRef, file);
            const url = await getDownloadURL(fileRef);
            push(ref(db, 'chat'), { u: localStorage.getItem('chatUser'), t: url, type: 'image' });
            status.classList.add('hidden');
        };

        window.logout = () => { localStorage.clear(); location.reload(); };
    </script>
    <style>
        .animate-fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col overflow-hidden">

    <div id="login-screen" class="flex-1 flex items-center justify-center p-6">
        <div class="bg-slate-800 p-10 rounded-[2.5rem] w-full max-w-sm shadow-2xl border border-slate-700 text-center">
            <h1 class="text-4xl font-extrabold text-blue-400 italic">Not Alone</h1>
            <p class="text-gray-400 text-sm mb-8 mt-1 italic">ඔබට දැන් තනියක් නෑ.</p>
            <div class="space-y-4">
                <input id="username" placeholder="User Name" class="w-full bg-slate-900 p-5 rounded-2xl outline-none border border-slate-700 focus:border-blue-500 text-sm">
                <input id="password" type="password" placeholder="Password" class="w-full bg-slate-900 p-5 rounded-2xl outline-none border border-slate-700 focus:border-blue-500 text-sm">
                <button onclick="handleLogin()" class="w-full bg-blue-600 py-5 rounded-2xl font-bold hover:bg-blue-500 active:scale-95 transition-all text-lg">Login / Register</button>
            </div>
        </div>
    </div>

    <div id="admin-panel" class="hidden flex-1 flex flex-col p-6 overflow-hidden">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800 text-blue-400 font-bold">සන්නාම Dashboard<button onclick="logout()" class="text-xs bg-red-600 px-3 py-1 rounded-full text-white">Logout</button></div>
        <div id="user-list" class="flex-1 overflow-y-auto"></div>
    </div>

    <div id="chat-screen" class="hidden flex flex-col h-full overflow-hidden">
        <div class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
            <h2 class="font-bold text-blue-400 italic text-xl">Not Alone</h2>
            <button onclick="logout()" class="text-xs bg-red-900/30 px-5 py-2 rounded-full text-red-400">Logout</button>
        </div>
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-2 bg-slate-900"></div>
        <div id="upload-status" class="hidden px-4 py-1 text-[10px] text-blue-400 italic bg-slate-800">Uploading image...</div>
        <div class="p-4 bg-slate-800 border-t border-slate-700 flex gap-2 items-center">
            <label class="cursor-pointer hover:text-blue-400 transition-colors">
                <span class="text-2xl">📎</span>
                <input type="file" accept="image/*" class="hidden" onchange="uploadImage(event)">
            </label>
            <input id="msg" placeholder="අදහස ලියන්න..." class="flex-1 bg-slate-900 p-4 rounded-2xl outline-none border border-slate-700 text-sm">
            <button onclick="send()" class="bg-blue-600 p-4 rounded-2xl font-bold">➤</button>
        </div>
    </div>

</body>
</html>
