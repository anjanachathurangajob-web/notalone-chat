<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Alone - Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtN7nwhc1XrYa8mGNLMQlKicFj-f5yG0k",
            authDomain: "notalonewithgemini.firebaseapp.com",
            projectId: "notalonewithgemini",
            databaseURL: "https://notalonewithgemini-default-rtdb.firebaseio.com",
            storageBucket: "notalonewithgemini.firebasestorage.app",
            messagingSenderId: "541160542822",
            appId: "1:541160542822:web:12570e417ed92c3f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- ADMIN PASSWORD එක ---
        const ADMIN_PASS = "arasubaanjana"; 

        window.handleLogin = async () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if(!user || !pass) return alert("විස්තර පුරවන්න.");

            const userRef = ref(db, 'users/' + user);
            const snapshot = await get(userRef);

            if (!snapshot.exists()) {
                await set(userRef, { password: pass, isPaid: false });
                window.location.href = `https://wa.me/94773364401?text=New%20Register:%20${user}`;
                alert("ඔබේ ගිණුම සෑදුවා! සන්නාම විසින් එය Approve කළ පසු ලොග් විය හැක.");
            } else {
                const userData = snapshot.val();
                if(userData.password === pass) {
                    if(userData.isPaid) {
                        localStorage.setItem('chatUser', user);
                        location.reload();
                    } else { alert("ඔබේ ගිණුම සක්‍රීය කර ගැනීමට WhatsApp (0773364401) අමතන්න."); }
                } else { alert("මුරපදය වැරදියි!"); }
            }
        };

        window.adminLogin = () => {
            const p = prompt("Admin Password එක ඇතුළත් කරන්න:");
            if(p === ADMIN_PASS) {
                localStorage.setItem('isAdmin', 'true');
                location.reload();
            } else { alert("වැරදි මුරපදයක්!"); }
        };

        function showAdminPanel() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            onValue(ref(db, 'users'), (s) => {
                const list = document.getElementById('user-list');
                list.innerHTML = "";
                s.forEach(c => {
                    const data = c.val();
                    list.innerHTML += `<div class="p-4 bg-slate-700 mb-2 rounded-xl flex justify-between items-center">
                        <div><b>${c.key}</b><br><span class="text-xs text-yellow-400">Pass: ${data.password}</span></div>
                        <button onclick="approve('${c.key}')" class="bg-blue-600 px-4 py-2 rounded-lg text-xs">${data.isPaid ? 'Approved ✓' : 'Approve'}</button>
                    </div>`;
                });
            });
        }

        window.approve = (name) => update(ref(db, 'users/' + name), { isPaid: true });
        window.logout = () => { localStorage.clear(); location.reload(); };

        window.onload = () => {
            if(localStorage.getItem('isAdmin')) return showAdminPanel();
            if(localStorage.getItem('chatUser')) return showChat();
        };

        function showChat() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            onValue(ref(db, 'chat'), (s) => {
                const b = document.getElementById('messages'); b.innerHTML = "";
                s.forEach(c => {
                    const m = c.val();
                    const isMe = m.u === localStorage.getItem('chatUser');
                    b.innerHTML += `<div class="flex ${isMe ? 'justify-end' : 'justify-start'} mb-2">
                        <div class="${isMe ? 'bg-blue-600' : 'bg-slate-700'} p-3 rounded-2xl max-w-[80%] shadow">
                            <p class="text-[10px] font-bold text-blue-300">${m.u}</p>
                            <p class="text-sm">${m.t}</p>
                        </div></div>`;
                });
                b.scrollTop = b.scrollHeight;
            });
        }

        window.send = () => {
            const t = document.getElementById('msg').value;
            if(t) push(ref(db, 'chat'), { u: localStorage.getItem('chatUser'), t: t });
            document.getElementById('msg').value = "";
        };
    </script>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col">
    <div id="login-screen" class="flex-1 flex flex-col items-center justify-center p-6">
        <div class="bg-slate-800 p-8 rounded-[2rem] w-full max-w-sm shadow-2xl border border-slate-700">
            <h1 class="text-3xl font-bold text-center text-blue-400 mb-8 italic">Not Alone</h1>
            <input id="username" placeholder="User Name" class="w-full bg-slate-900 p-4 rounded-xl mb-4 outline-none border border-slate-700">
            <input id="password" type="password" placeholder="Password" class="w-full bg-slate-900 p-4 rounded-xl mb-6 outline-none border border-slate-700">
            <button onclick="handleLogin()" class="w-full bg-blue-600 py-4 rounded-xl font-bold hover:bg-blue-500 transition-all">Login / Register</button>
            <div class="text-center mt-6">
                <button onclick="adminLogin()" class="text-[10px] text-gray-500 uppercase tracking-widest hover:text-blue-400 underline">Admin Login</button>
            </div>
        </div>
    </div>

    <div id="admin-panel" class="hidden flex-1 p-6 flex flex-col overflow-hidden">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-blue-400">සන්නාම Dashboard</h2>
            <button onclick="logout()" class="text-xs bg-red-600 px-3 py-1 rounded">Logout</button>
        </div>
        <div id="user-list" class="flex-1 overflow-y-auto"></div>
    </div>

    <div id="chat-screen" class="hidden flex flex-col h-full overflow-hidden">
        <div class="p-4 bg-slate-800 flex justify-between"><b>Not Alone</b><button onclick="logout()" class="text-xs text-red-400">Logout</button></div>
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
        <div class="p-4 bg-slate-900 flex gap-2"><input id="msg" class="flex-1 bg-slate-800 p-4 rounded-xl outline-none"><button onclick="send()" class="bg-blue-600 px-6 py-3 rounded-xl font-bold">Send</button></div>
    </div>
</body>
</html>
