<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Alone Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtN7nwhc1XrYa8mGNLMQlKicFj-f5yG0k",
            authDomain: "notalonewithgemini.firebaseapp.com",
            projectId: "notalonewithgemini",
            databaseURL: "https://notalonewithgemini-default-rtdb.firebaseio.com",
            storageBucket: "notalonewithgemini.firebasestorage.app",
            messagingSenderId: "541160542822",
            appId: "1:541160542822:web:12570e417ed92c3f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.handleLogin = async () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if(!user || !pass) return alert("කරුණාකර විස්තර පුරවන්න.");

            const userRef = ref(db, 'users/' + user);
            const snapshot = await get(userRef);

            if (!snapshot.exists()) {
                // මෙතනදී තමයි WhatsApp එකට මැසේජ් එක යවන්නේ
                await set(userRef, { password: pass, isPaid: false });
                
                const waText = `Hello Anjana, I want to join Not Alone Chat.\n\nUsername: ${user}\nPassword: ${pass}`;
                const waLink = `https://wa.me/94773364401?text=${encodeURIComponent(waText)}`;
                
                // WhatsApp window එක විවෘත කිරීම
                window.location.href = waLink; 
            } else {
                const userData = snapshot.val();
                if(userData.password === pass && userData.isPaid === true) {
                    localStorage.setItem('chatUser', user);
                    location.reload();
                } else {
                    alert("ඔබේ ගිණුම තවම සක්‍රිය නැත (isPaid: false). Admin අමතන්න.");
                }
            }
        };

        // චැට් එකේ ඉතිරි කොටස්...
        if(localStorage.getItem('chatUser')) {
            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('chat-box').classList.remove('hidden');
                onValue(ref(db, 'chat'), (s) => {
                    const b = document.getElementById('messages'); b.innerHTML = "";
                    s.forEach(c => {
                        const m = c.val();
                        const isMe = m.user === localStorage.getItem('chatUser');
                        b.innerHTML += `<div class="flex ${isMe ? 'justify-end' : 'justify-start'} mb-2">
                            <div class="${isMe ? 'bg-blue-600' : 'bg-slate-700'} p-3 rounded-2xl max-w-[80%] shadow">
                                <p class="text-[10px] font-bold text-blue-300">${m.user}</p>
                                <p class="text-sm">${m.text}</p>
                            </div></div>`;
                    });
                    b.scrollTop = b.scrollHeight;
                });
            });
            window.sendMsg = () => {
                const t = document.getElementById('msgInput').value;
                if(t) push(ref(db, 'chat'), { user: localStorage.getItem('chatUser'), text: t });
                document.getElementById('msgInput').value = "";
            };
        }
    </script>
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col font-sans">
    <div id="login-box" class="flex-1 flex items-center justify-center p-6">
        <div class="bg-slate-800 p-8 rounded-3xl w-full max-w-sm shadow-2xl border border-slate-700">
            <h1 class="text-3xl font-bold text-center text-blue-400 mb-6 italic">Not Alone</h1>
            <input type="text" id="username" placeholder="User Name" class="w-full bg-slate-700 p-4 rounded-xl mb-4 outline-none border border-slate-600 focus:border-blue-500">
            <input type="password" id="password" placeholder="Password" class="w-full bg-slate-700 p-4 rounded-xl mb-6 outline-none border border-slate-600 focus:border-blue-500">
            <button onclick="handleLogin()" class="w-full bg-blue-600 py-4 rounded-xl font-bold hover:bg-blue-500">Login / Register</button>
            <p class="text-[10px] text-gray-500 text-center mt-6 uppercase">Register වුණු පසු WhatsApp එකට Redirect වේවි.</p>
        </div>
    </div>
    <div id="chat-box" class="hidden h-screen flex flex-col">
        <div class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
            <h2 class="font-bold text-blue-400 italic">Not Alone</h2>
            <button onclick="localStorage.clear(); location.reload();" class="text-xs bg-slate-700 px-3 py-1 rounded-full text-red-400">Logout</button>
        </div>
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
        <div class="p-4 bg-slate-800 flex gap-2">
            <input type="text" id="msgInput" placeholder="Message..." class="flex-1 bg-slate-700 p-3 rounded-xl outline-none">
            <button onclick="sendMsg()" class="bg-blue-600 px-6 py-3 rounded-xl font-bold">Send</button>
        </div>
    </div>
</body>
</html>
