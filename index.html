<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Alone - Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtN7nwhc1XrYa8mGNLMQlKicFj-f5yG0k",
            authDomain: "notalonewithgemini.firebaseapp.com",
            projectId: "notalonewithgemini",
            databaseURL: "https://notalonewithgemini-default-rtdb.firebaseio.com",
            storageBucket: "notalonewithgemini.firebasestorage.app",
            messagingSenderId: "541160542822",
            appId: "1:541160542822:web:12570e417ed92c3f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const ADMIN_USER = "admin"; 
        const ADMIN_PASS = "913132386V"; 

        window.handleLogin = async () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if(!user || !pass) return alert("විස්තර ඇතුළත් කරන්න.");

            if(user === ADMIN_USER && pass === ADMIN_PASS) {
                localStorage.setItem('isAdmin', 'true');
                localStorage.removeItem('chatUser');
                showAdminPanel();
                return;
            }

            const userRef = ref(db, 'users/' + user);
            const snapshot = await get(userRef);

            if (!snapshot.exists()) {
                await set(userRef, { password: pass, isPaid: false });
                window.location.href = `https://wa.me/94773364401?text=New Register: ${user}`;
                alert("ඔබේ ගිණුම සෑදුවා! සන්නාම විසින් එය Approve කළ පසු ලොග් විය හැක.");
            } else {
                const userData = snapshot.val();
                if(userData.password === pass) {
                    if(userData.isPaid) {
                        localStorage.setItem('chatUser', user);
                        localStorage.removeItem('isAdmin');
                        location.reload();
                    } else { 
                        alert("ඔබේ ගිණුම සක්‍රීය කර ගැනීමට WhatsApp ඔස්සේ 0773364401 අංකයට පණිවිඩයක් යවන්න."); 
                    }
                } else { alert("මුරපදය වැරදියි!"); }
            }
        };

        function showAdminPanel() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            
            onValue(ref(db, 'users'), (snapshot) => {
                const list = document.getElementById('user-list');
                list.innerHTML = "";
                snapshot.forEach(child => {
                    const name = child.key;
                    const data = child.val();
                    if(name !== ADMIN_USER) {
                        list.innerHTML += `
                            <div class="flex justify-between items-center p-4 bg-slate-700 mb-3 rounded-xl border border-slate-600 shadow-md">
                                <div>
                                    <p class="font-bold text-white text-lg">${name}</p>
                                    <p class="text-[12px] text-yellow-400 font-mono italic">Pass: ${data.password}</p>
                                    <p class="text-[11px] text-gray-400">Status: ${data.isPaid ? 'Approved ✓' : 'Pending'}</p>
                                </div>
                                <button onclick="approveUser('${name}')" class="${data.isPaid ? 'bg-green-600' : 'bg-blue-600'} px-5 py-2 rounded-xl text-xs font-bold transition-all active:scale-95">
                                    ${data.isPaid ? 'Done' : 'Approve'}
                                </button>
                            </div>`;
                    }
                });
            });
        }

        window.approveUser = (name) => {
            update(ref(db, 'users/' + name), { isPaid: true });
        };

        window.onload = () => {
            if(localStorage.getItem('isAdmin') === 'true') showAdminPanel();
            else if(localStorage.getItem('chatUser')) showChat();
        };

        function showChat() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            onValue(ref(db, 'chat'), (s) => {
                const b = document.getElementById('messages'); b.innerHTML = "";
                s.forEach(c => {
                    const m = c.val();
                    const isMe = m.u === localStorage.getItem('chatUser');
                    b.innerHTML += `<div class="flex ${isMe ? 'justify-end' : 'justify-start'} mb-2">
                        <div class="${isMe ? 'bg-blue-600' : 'bg-slate-700'} p-3 rounded-2xl max-w-[80%] shadow">
                            <p class="text-[10px] font-bold text-blue-300">${m.u}</p>
                            <p class="text-sm">${m.t}</p>
                        </div></div>`;
                });
                b.scrollTop = b.scrollHeight;
            });
        }

        window.send = () => {
            const t = document.getElementById('msg').value;
            if(t) push(ref(db, 'chat'), { u: localStorage.getItem('chatUser'), t: t });
            document.getElementById('msg').value = "";
        };

        window.logout = () => {
            localStorage.clear();
            location.reload();
        };

    </script>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col overflow-hidden">

    <div id="login-screen" class="flex-1 flex items-center justify-center p-6">
        <div class="bg-slate-800 p-10 rounded-[2.5rem] w-full max-sm:max-w-sm shadow-2xl border border-slate-700 text-center">
            <h1 class="text-4xl font-extrabold text-blue-400 italic">Not Alone</h1>
            <p class="text-gray-400 text-sm mb-8 mt-1">ඔබට දැන් තනියක් නෑ.</p>
            
            <div class="space-y-5">
                <input id="username" placeholder="User Name" class="w-full bg-slate-900 p-5 rounded-2xl outline-none border border-slate-700 focus:border-blue-500 text-sm">
                <input id="password" type="password" placeholder="Password" class="w-full bg-slate-900 p-5 rounded-2xl outline-none border border-slate-700 focus:border-blue-500 text-sm">
                <button onclick="handleLogin()" class="w-full bg-blue-600 py-5 rounded-2xl font-bold hover:bg-blue-500 active:scale-95 transition-all text-lg shadow-lg shadow-blue-900/30">Login / Register</button>
            </div>
            <p class="text-[10px] text-gray-600 mt-8 uppercase TRACKING-WIDE italic">Admin Access Enabled</p>
        </div>
    </div>

    <div id="admin-panel" class="hidden flex-1 flex flex-col p-6 overflow-hidden">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
            <h2 class="text-2xl font-bold text-blue-400">සන්නාම Dashboard</h2>
            <button onclick="logout()" class="bg-red-900/30 px-6 py-2 rounded-full text-red-400 font-bold border border-red-900/50">Logout</button>
        </div>
        <div id="user-list" class="flex-1 overflow-y-auto"></div>
    </div>

    <div id="chat-screen" class="hidden flex flex-col h-full overflow-hidden">
        <div class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
            <h2 class="font-bold text-blue-400 italic text-xl">Not Alone Chat</h2>
            <button onclick="logout()" class="text-xs bg-red-900/30 px-5 py-2 rounded-full text-red-400">Logout</button>
        </div>
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        <div class="p-4 bg-slate-900 border-t border-slate-800 flex gap-2">
            <input id="msg" placeholder="අදහස ලියන්න..." class="flex-1 bg-slate-800 p-4 rounded-2xl outline-none border border-slate-700">
            <button onclick="send()" class="bg-blue-600 px-8 py-4 rounded-2xl font-bold">Send</button>
        </div>
    </div>

</body>
</html>
